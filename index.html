<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Test</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0284c7; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>HTML & CSS Test</h2>
        <form id="test-form" onsubmit="submitTest(event)">
            <div class="input-group">
                <label>Zirlai Hming</label>
                <input type="text" id="student-name" readonly required>
            </div>
            <div class="input-group">
                <label>Enrollment Number</label>
                <input type="text" id="student-enrollment" readonly required>
            </div>
            <!-- Zawhna -->
            <p>1. HTML tih hi enge a awmzia?</p>
            <input type="radio" name="q1" value="a" required> Hyper Text Markup Language<br><br>
            <p>2. CSS ah id thlan nan eng symbol nge hman?</p>
            <input type="radio" name="q2" value="b" required> # (Hash)<br><br>
            <button type="submit">Submit Test</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyAYardtj2WcBiUGSD9Ytqa0yZUWwjEXgis",
            projectId: "bethel-portal-1641f",
            // ... (I firebase config dang zawng zawng dah belh rawh)
        });
        const db = getFirestore(app);

        // URL-a data awm ang ang a rawn in-fill sa ang
        const params = new URLSearchParams(window.location.search);
        document.getElementById('student-enrollment').value = params.get('enrollment') || '';
        document.getElementById('student-name').value = params.get('name') || '';

        window.submitTest = async (e) => {
            e.preventDefault();
            const enr = document.getElementById('student-enrollment').value;
            const name = document.getElementById('student-name').value;
            
            await setDoc(doc(db, "student_results", enr), {
                enrollment: enr, name: name, totalScore: 2, internalMark10: 10, submittedAt: serverTimestamp()
            });
            alert("Success!");
        }
    </script>
</body>
</html>
