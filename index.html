<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bethel Test Portal</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        input { width: 95%; padding: 10px; margin-bottom: 10px; }
        button { background: #0284c7; color: white; padding: 10px; width: 100%; border: none; }
    </style>
</head>
<body>
    <div class="container" id="login-box">
        <h3>Enrollment Number chhu rawh</h3>
        <input type="text" id="check-enr" placeholder="Entirnan: 2602001">
        <button onclick="verifyStudent()">Verify & Test Start</button>
    </div>

    <div class="container" id="test-box" style="display:none;">
        <h2 id="student-display"></h2>
        <form id="test-form" onsubmit="submitTest(event)">
            <p>1. HTML tag container siam nan?</p>
            <input type="radio" name="q1" value="div" required> &lt;div&gt; <br>
            <p>2. CSS Padding hi?</p>
            <input type="radio" name="q2" value="padding" required> Content leh Border inkar <br>
            <button type="submit">Submit Test</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAYardtj2WcBiUGSD9Ytqa0yZUWwjEXgis", projectId: "bethel-portal-1641f" }));
        
        let studentData = null;

        window.verifyStudent = async () => {
            const enr = document.getElementById('check-enr').value;
            const docSnap = await getDoc(doc(db, "students", enr));
            if(docSnap.exists()) {
                studentData = docSnap.data();
                document.getElementById('student-display').innerText = "Zirlai: " + studentData.name;
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('test-box').style.display = 'block';
            } else {
                alert("Database-ah he enrollment hi a awm lo!");
            }
        };

        window.submitTest = async (e) => {
            e.preventDefault();
            await setDoc(doc(db, "student_results", studentData.enrollment), {
                enrollment: studentData.enrollment, name: studentData.name, submittedAt: serverTimestamp()
            });
            alert("Test thehluh a ni ta!");
        }
    </script>
</body>
</html>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyAYardtj2WcBiUGSD9Ytqa0yZUWwjEXgis", projectId: "bethel-portal-1641f" });
        const db = getFirestore(app);

        // URL parameter kan man dan:
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const enr = params.get('enrollment');
            const name = params.get('name');

            console.log("Param hmuh:", enr, name); // Hemi hian console-ah a rawn lang ngei tur a ni

            if(enr && name) {
                document.getElementById('student-enrollment').value = enr;
                document.getElementById('student-name').value = name;
                document.getElementById('test-form').style.display = 'block';
                document.getElementById('auth-warning').style.display = 'none';
            } else {
                document.getElementById('test-form').style.display = 'none';
                document.getElementById('auth-warning').style.display = 'block';
            }
        };

        window.submitTest = async (e) => {
            e.preventDefault();
            const enr = document.getElementById('student-enrollment').value;
            const name = document.getElementById('student-name').value;
            
            await setDoc(doc(db, "student_results", enr), {
                enrollment: enr, 
                name: name, 
                totalScore: 5, 
                outOf: 5, 
                internalMark10: 10, 
                submittedAt: serverTimestamp()
            });
            alert("Test thehluh a ni ta!");
        }
    </script>
